services:
  gateway:
    build:
      context: .
      target: gateway
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {}
      private:
        ipv4_address: 172.30.0.2
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
  api:
    build:
      context: .
      target: api
    environment:
      APP_ENV: production
      ALLOWED_HOSTS: ${APP_DOMAIN:?Set APP_DOMAIN}
      CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      RETENTION_SECONDS: ${RETENTION_SECONDS:-3600}
      SCREENER_DATA_DIR: /data
      SCREENER_KEY_FILE: /run/secrets/screener_storage_key
    secrets:
      - source: screener_storage_key
        target: screener_storage_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - screener_data:/data
    networks:
      private:
        ipv4_address: 172.30.0.3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
networks:
  edge: {}
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  screener_data: {}
  caddy_data: {}
  caddy_config: {}
secrets:
  screener_storage_key:
    file: ${SCREENER_KEY_FILE:?Set SCREENER_KEY_FILE to a private host key file outside the project and data volume}
